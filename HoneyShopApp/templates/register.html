{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background-color: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #333;">Creare Cont</h2>
    <hr style="border: 1px solid #ddd; margin-bottom: 20px;">
    
    <form action="/register" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <label style="font-weight: bold;">Nume Complet:</label>
        <input type="text" name="name" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        
        <label style="font-weight: bold;">Email:</label>
        <input type="email" name="email" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        
        <label style="font-weight: bold;">Parolă:</label>
        <input type="password" name="password" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        
        <label style="font-weight: bold;">Telefon:</label>
        <input type="tel" name="phone" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        
        <label style="font-weight: bold;">Adresă Livrare:</label>
        <textarea name="address" rows="3" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;">
            Înregistrare
        </button>
    </form>
</div>
{% endblock %}
