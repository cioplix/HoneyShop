{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background-color: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    
    <h2 style="text-align: center; color: #333;">Autentificare</h2>
    <hr style="border: 1px solid #ddd; margin-bottom: 20px;">
    
   <form action="/login" method="POST" autocomplete="off" style="display: flex; flex-direction: column; gap: 15px;">

        <label for="email" style="font-weight: bold;">Email:</label>
        <input type="email" id="email" name="email" required autocomplete="off" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

        <label for="password" style="font-weight: bold;">Parolă:</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

        <button type="submit" style="background-color: #2196F3; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;">
            Intră în Cont
        </button>

    </form>
        
    </form>
</div>
{% endblock %}
