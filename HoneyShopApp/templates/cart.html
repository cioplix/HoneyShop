{% extends 'base.html' %}

{% block content %}
    <h1>Coșul Tău</h1>
    <hr>

    {% if items %}
<ul style="list-style-type: none; padding: 0;">
    {% for item in items %}
        <li style="margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; max-width: 500px;">
            <span><strong>{{ item.product.name }} (x{{ item.quantity }})</strong> - {{ item.product.price }} RON/buc</span>
            <form action="/remove_from_cart/{{ item.product.id }}" method="POST" style="margin: 0;">
                <button type="submit" style="background-color: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                    Șterge
                </button>
            </form>
        </li>
    {% endfor %}
</ul>

        <h3 style="color: #d32f2f;">Total de plată: {{ total }} RON</h3>
    <a href="/checkout" style = "text-decoration: none;">
        <button style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
            Finalizează Comanda
        </button>
    </a>
    {% else %}
        <p>Coșul tău este gol.</p>
    {% endif %}

{% endblock %}
